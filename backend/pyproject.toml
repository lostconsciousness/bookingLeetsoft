[project]
name = "schedule-optimizer-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.109.0",
  "greenlet>=3.0.0",
  "pydantic-settings>=2.1.0",
  "sqlalchemy>=2.0.25",
  "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
test = ["aiosqlite>=0.20.0", "pytest>=7.4.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
